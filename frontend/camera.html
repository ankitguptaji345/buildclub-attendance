<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Camera - Build Club Attendance</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="brand">🏆 BUILD CLUB</div>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <a href="camera.html" class="active">Live Camera</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>

  <div class="container">
    <div class="kiosk-banner">
      <div>🟢 <span class="open-pill">MAKERSPACE OPEN</span></div>
      <div class="clock" id="liveClock">--:--:--</div>
      <div>
        <button class="icon-btn" id="muteBtn">🔊 Sound On</button>
        <button class="icon-btn" id="kioskBtn">🖥️ Kiosk Mode</button>
      </div>
    </div>

    <div class="card">
      <h1>📷 Live Attendance Camera</h1>
      <p>Leave this page open on the makerspace laptop. It will automatically recognize members and log their time.</p>

      <div class="video-wrap">
        <video id="video" autoplay muted playsinline width="480" height="360"></video>
        <canvas id="overlay" width="480" height="360"></canvas>
      </div>

      <div id="status" class="status"></div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script defer src="lib/face-api.min.js"></script>
  <script defer src="js/toast.js"></script>
  <script defer src="js/camera.js"></script>
</body>
</html>
