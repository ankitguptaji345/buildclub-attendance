<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Reports</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #764ba2; }
        .btn-small { padding: 6px 12px; font-size: 12px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card { background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-weight: 600;
            border-radius: 10px 10px 0 0;
        }
        .card-content { padding: 20px; }
        .chart-container { position: relative; height: 300px; }
        .stat-value { font-size: 48px; font-weight: 700; color: #667eea; text-align: center; padding: 30px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .alert { padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Analytics & Reports</h1>
            <div>
                <button class="btn" onclick="exportReports()" style="margin-right:10px;">📥 Export All</button>
                <button class="btn" onclick="location.href='/dashboard.html'">← Dashboard</button>
            </div>
        </div>

        <div id="alert-container"></div>

        <div class="grid">
            <div class="card">
                <div class="card-header">📈 Total Visits (14 days)</div>
                <div class="card-content"><div class="stat-value" id="stat-visits">0</div></div>
            </div>
            <div class="card">
                <div class="card-header">⏱️ Avg Duration</div>
                <div class="card-content"><div class="stat-value" id="stat-avgduration">0<span style="font-size:24px;">min</span></div></div>
            </div>
            <div class="card">
                <div class="card-header">👥 Active Members</div>
                <div class="card-content"><div class="stat-value" id="stat-active">0</div></div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-header">📅 Daily Visits</div>
                <div class="card-content"><div class="chart-container"><canvas id="daily-chart"></canvas></div></div>
            </div>
            <div class="card">
                <div class="card-header">🕐 Peak Hours (Check-Ins)</div>
                <div class="card-content"><div class="chart-container"><canvas id="checkin-chart"></canvas></div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">⏰ Top Members by Hours</div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Name</th>
                            <th>Total Hours</th>
                            <th>Total Visits</th>
                            <th>Avg Duration</th>
                            <th>Last Visit</th>
                            <th>Report</th>
                        </tr>
                    </thead>
                    <tbody id="hours-table">
                        <tr><td colspan="7" class="loading">Loading analytics...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let dailyChart = null;
        let checkinChart = null;
        let lastHoursData = [];
        let rawLog = [];

        document.addEventListener('DOMContentLoaded', loadAnalytics);

        async function loadAnalytics() {
            try {
                const [heatmapRes, summaryRes, logRes] = await Promise.all([
                    fetch('/api/attendance/heatmap'),
                    fetch('/api/attendance/summary'),
                    fetch('/api/attendance')
                ]);

                if (!heatmapRes.ok || !summaryRes.ok || !logRes.ok) {
                    throw new Error('Failed to load analytics');
                }

                const heatmapData = await heatmapRes.json();   // [{date, totalHours, visits}]
                const summaryData = await summaryRes.json();   // [{buildClubId, name, totalHours, visits, streak}]
                const logData = await logRes.json();            // full attendance rows
                rawLog = logData;

                const lastVisitById = {};
                logData.forEach(r => {
                    if (!lastVisitById[r.buildClubId] || new Date(r.checkIn) > new Date(lastVisitById[r.buildClubId])) {
                        lastVisitById[r.buildClubId] = r.checkIn;
                    }
                });

                const hoursData = summaryData.map(m => ({
                    buildClubId: m.buildClubId,
                    name: m.name,
                    total_hours: m.totalHours || 0,
                    total_visits: m.visits || 0,
                    avg_duration_min: m.visits > 0 ? (m.totalHours * 60) / m.visits : 0,
                    last_visit: lastVisitById[m.buildClubId] || null
                })).sort((a, b) => b.total_hours - a.total_hours);
                lastHoursData = hoursData;

                const last14 = heatmapData.slice(-14);

                const hourCounts = Array(24).fill(0);
                logData.forEach(r => {
                    if (r.checkIn) hourCounts[new Date(r.checkIn).getHours()]++;
                });

                renderCharts(last14, hourCounts);
                renderTable(hoursData);
                updateStats(last14, hoursData);
            } catch (err) {
                showAlert('Error loading analytics: ' + err.message, 'error');
                document.getElementById('hours-table').innerHTML =
                    `<tr><td colspan="7" class="loading" style="color:red;">Error: ${err.message}</td></tr>`;
            }
        }

        function updateStats(dailyData, hoursData) {
            const totalVisits = dailyData.reduce((sum, d) => sum + (d.visits || 0), 0);
            const avgDuration = hoursData.length > 0
                ? Math.round(hoursData.reduce((sum, h) => sum + (h.avg_duration_min || 0), 0) / hoursData.length)
                : 0;
            const activeMembers = hoursData.filter(h => h.total_hours > 0).length;

            document.getElementById('stat-visits').textContent = totalVisits;
            document.getElementById('stat-avgduration').innerHTML = avgDuration + '<span style="font-size:24px;">min</span>';
            document.getElementById('stat-active').textContent = activeMembers;
        }

        function renderCharts(dailyData, hourCounts) {
            const dates = dailyData.map(d => d.date);
            const visits = dailyData.map(d => d.visits || 0);

            if (dailyChart) dailyChart.destroy();
            const ctx1 = document.getElementById('daily-chart');
            if (ctx1) {
                dailyChart = new Chart(ctx1.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Visits',
                            data: visits,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                });
            }

            if (checkinChart) checkinChart.destroy();
            const ctx2 = document.getElementById('checkin-chart');
            if (ctx2) {
                checkinChart = new Chart(ctx2.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: hourCounts.map((_, h) => h + ':00'),
                        datasets: [{ label: 'Check-Ins', data: hourCounts, backgroundColor: '#27ae60' }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                });
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('hours-table');

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">No data available</td></tr>';
                return;
            }

            tbody.innerHTML = data.slice(0, 20).map((m, idx) => `
                <tr>
                    <td>#${idx + 1}</td>
                    <td><strong>${m.name || '-'}</strong></td>
                    <td>${(m.total_hours || 0).toFixed(1)} hrs</td>
                    <td>${m.total_visits || 0}</td>
                    <td>${(m.avg_duration_min || 0).toFixed(0)} min</td>
                    <td>${m.last_visit ? new Date(m.last_visit).toLocaleDateString() : '-'}</td>
                    <td><button class="btn btn-small" onclick="downloadMemberReport('${m.buildClubId}', '${(m.name || '').replace(/'/g, "\\'")}')">⬇️ Download</button></td>
                </tr>
            `).join('');
        }

        // Downloads ONE member's full check-in/check-out history as a CSV.
        function downloadMemberReport(buildClubId, name) {
            const rows = rawLog.filter(r => r.buildClubId === buildClubId)
                                .sort((a, b) => new Date(b.checkIn) - new Date(a.checkIn));

            if (rows.length === 0) {
                showAlert(`No attendance history found for ${name}.`, 'error');
                return;
            }

            let csv = `Attendance Report for ${name} (${buildClubId})\n`;
            csv += `Generated,${new Date().toLocaleString()}\n\n`;
            csv += 'Date,Check In,Check Out,Hours\n';
            rows.forEach(r => {
                const checkIn = r.checkIn ? new Date(r.checkIn).toLocaleString() : '';
                const checkOut = r.checkOut ? new Date(r.checkOut).toLocaleString() : 'Ongoing';
                csv += `"${r.date || ''}","${checkIn}","${checkOut}",${r.hours ?? ''}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name.replace(/\s+/g, '_')}_${buildClubId}_report.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function exportReports() {
            try {
                let csv = 'Name,Total Hours,Total Visits,Avg Duration (min),Last Visit\n';
                lastHoursData.forEach(m => {
                    const lastVisit = m.last_visit ? new Date(m.last_visit).toLocaleDateString() : '';
                    csv += `"${m.name || ''}",${(m.total_hours || 0).toFixed(2)},${m.total_visits || 0},${(m.avg_duration_min || 0).toFixed(2)},"${lastVisit}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `analytics_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);

                showAlert('Report exported successfully!', 'success');
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type || 'error'}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
