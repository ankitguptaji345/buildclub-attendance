<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
        }
        .search-box { flex: 1; min-width: 200px; }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
        }
        .btn:hover { background: #764ba2; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-small { padding: 6px 12px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8f9fa; border-bottom: 2px solid #ddd; }
        th { padding: 15px; text-align: left; font-weight: 600; color: #333; font-size: 14px; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background: #f8f9fa; }
        .role-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #e2e3ff;
            color: #444fd1;
            text-transform: capitalize;
        }
        .actions { display: flex; gap: 5px; }
        .alert { padding: 15px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px 30px;
            background: #f8f9fa;
        }
        .stat-card { background: white; padding: 15px; border-radius: 8px; border-left: 4px solid #667eea; }
        .stat-label { font-size: 12px; color: #999; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: 600; color: #333; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .table-wrapper { overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Members Management</h1>
            <button class="btn" onclick="goToDashboard()" style="background:white;color:#667eea;">← Dashboard</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Members</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Have Visited</div>
                <div class="stat-value" id="stat-active">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Guests</div>
                <div class="stat-value" id="stat-guests">0</div>
            </div>
        </div>

        <div id="alert-container" style="padding: 0 30px;"></div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search name or Build Club ID...">
            </div>
            <select id="role-filter">
                <option value="">All Roles</option>
                <option value="admin">Admin</option>
                <option value="mentor">Mentor</option>
                <option value="member">Member</option>
                <option value="guest">Guest</option>
            </select>
            <button class="btn" onclick="exportAllMembers()">⬇️ Export CSV</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Build Club ID</th>
                        <th>Role</th>
                        <th>Registered</th>
                        <th>Visits</th>
                        <th>Total Hours</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="members-table">
                    <tr><td colspan="7" class="loading">Loading members...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD_KEY = 'buildclub_admin_password';
        let allMembers = [];

        function getAdminPassword() {
            let pass = sessionStorage.getItem(ADMIN_PASSWORD_KEY);
            if (!pass) {
                pass = prompt('Enter admin password:');
                if (pass) sessionStorage.setItem(ADMIN_PASSWORD_KEY, pass);
            }
            return pass;
        }

        async function adminFetch(url, options = {}) {
            const headers = { ...(options.headers || {}), 'x-admin-password': getAdminPassword() };
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) sessionStorage.removeItem(ADMIN_PASSWORD_KEY);
            return response;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMembers();
            document.getElementById('search-input').addEventListener('input', renderFromFilters);
            document.getElementById('role-filter').addEventListener('change', renderFromFilters);
        });

        async function loadMembers() {
            try {
                const [membersRes, summaryRes] = await Promise.all([
                    fetch('/api/members'),
                    fetch('/api/attendance/summary')
                ]);

                if (!membersRes.ok) throw new Error(`Server error: ${membersRes.status}`);

                const members = await membersRes.json();
                const summary = summaryRes.ok ? await summaryRes.json() : [];

                const summaryById = {};
                summary.forEach(s => { summaryById[s.buildClubId] = s; });

                allMembers = members.map(m => ({
                    ...m,
                    visits: summaryById[m.buildClubId]?.visits || 0,
                    totalHours: summaryById[m.buildClubId]?.totalHours || 0
                }));

                renderFromFilters();
            } catch (err) {
                showAlert('Error loading members: ' + err.message, 'error');
                document.getElementById('members-table').innerHTML =
                    `<tr><td colspan="7" class="loading" style="color:red;">Error: ${err.message}</td></tr>`;
            }
        }

        function renderFromFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const role = document.getElementById('role-filter').value;

            let filtered = allMembers;
            if (role) filtered = filtered.filter(m => m.role === role);
            if (search) {
                filtered = filtered.filter(m =>
                    (m.name || '').toLowerCase().includes(search) ||
                    (m.buildClubId || '').toLowerCase().includes(search)
                );
            }

            renderMembers(filtered);
            updateStats(allMembers);
        }

        function renderMembers(members) {
            const tbody = document.getElementById('members-table');

            if (!members || members.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">No members found</td></tr>';
                return;
            }

            tbody.innerHTML = members.map(member => `
                <tr>
                    <td><strong>${member.name || '-'}</strong></td>
                    <td>${member.buildClubId || '-'}</td>
                    <td><span class="role-badge">${member.role || 'member'}</span></td>
                    <td>${member.createdAt ? new Date(member.createdAt).toLocaleDateString() : '-'}</td>
                    <td>${member.visits || 0}</td>
                    <td>${(member.totalHours || 0).toFixed(1)} hrs</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-small btn-danger" onclick="deleteMember('${member.buildClubId}', '${(member.name || '').replace(/'/g, "\\'")}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(members) {
            const total = members.length;
            const active = members.filter(m => (m.visits || 0) > 0).length;
            const guests = members.filter(m => m.role === 'guest').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-guests').textContent = guests;
        }

        async function deleteMember(buildClubId, name) {
            if (!confirm(`Delete ${name} (${buildClubId})? This permanently removes them and their attendance history. This cannot be undone.`)) return;

            try {
                const response = await adminFetch(`/api/members/${encodeURIComponent(buildClubId)}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to delete');

                showAlert(`${name} was deleted.`, 'success');
                loadMembers();
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }

        function exportAllMembers() {
            try {
                let csv = 'Name,Build Club ID,Role,Registered,Visits,Total Hours\n';
                allMembers.forEach(m => {
                    const registered = m.createdAt ? new Date(m.createdAt).toLocaleDateString() : '';
                    csv += `"${m.name || ''}","${m.buildClubId || ''}","${m.role || 'member'}","${registered}",${m.visits || 0},${(m.totalHours || 0).toFixed(2)}\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `members_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function goToDashboard() {
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
