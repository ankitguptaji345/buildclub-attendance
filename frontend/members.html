<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #764ba2; }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover { background: #c0392b; }
        .btn-success {
            background: #27ae60;
        }
        .btn-success:hover { background: #229954; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        tr:hover { background: #f8f9fa; }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px 30px;
            background: #f8f9fa;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Members Management</h1>
            <button class="btn" onclick="location.href='/'">← Dashboard</button>
        </div>
        
        <div id="alert-container"></div>
        
        <div class="stats">
            <div class="stat-card">
                <div style="font-size:12px;color:#999;">Total Members</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size:12px;color:#999;">Active Members</div>
                <div class="stat-value" id="stat-active">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size:12px;color:#999;">Guests</div>
                <div class="stat-value" id="stat-guests">0</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search name, email, phone...">
            </div>
            <select id="role-filter">
                <option value="">All Roles</option>
                <option value="member">Member</option>
                <option value="admin">Admin</option>
            </select>
            <select id="status-filter">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
            <button class="btn btn-success" onclick="exportAllMembers()">📥 Export CSV</button>
        </div>
        
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Visits</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="members-table">
                    <tr><td colspan="7" style="text-align:center;color:#999;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2>Edit Member</h2>
            <form id="edit-form" onsubmit="saveEditMember(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit-email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="edit-phone">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="edit-role">
                        <option value="member">Member</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="edit-status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
                    <button type="button" class="btn" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentMemberId = null;
        
        document.addEventListener('DOMContentLoaded', loadMembers);
        document.getElementById('search-input').addEventListener('input', loadMembers);
        document.getElementById('role-filter').addEventListener('change', loadMembers);
        document.getElementById('status-filter').addEventListener('change', loadMembers);
        
        async function loadMembers() {
            try {
                const search = document.getElementById('search-input').value;
                const role = document.getElementById('role-filter').value;
                const status = document.getElementById('status-filter').value;
                
                let url = '/api/admin/members?';
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (role) url += `role=${role}&`;
                if (status) url += `status=${status}&`;
                
                const response = await fetch(url);
                const members = await response.json();
                
                renderMembers(members);
                updateStats(members);
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        function renderMembers(members) {
            const tbody = document.getElementById('members-table');
            tbody.innerHTML = members.map(m => `
                <tr>
                    <td><strong>${m.name}</strong></td>
                    <td>${m.email || '-'}</td>
                    <td>${m.phone || '-'}</td>
                    <td>${m.role}</td>
                    <td><span class="status-badge ${m.status === 'active' ? 'status-active' : 'status-inactive'}">${m.status}</span></td>
                    <td>${m.total_visits || 0}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-small" onclick="viewProfile(${m.id})">View</button>
                            <button class="btn btn-small" onclick="editMember(${m.id})">Edit</button>
                            <button class="btn btn-small btn-danger" onclick="deleteMember(${m.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        
        function updateStats(members) {
            document.getElementById('stat-total').textContent = members.length;
            document.getElementById('stat-active').textContent = members.filter(m => m.status === 'active').length;
            document.getElementById('stat-guests').textContent = members.filter(m => m.member_type === 'guest').length;
        }
        
        async function editMember(memberId) {
            try {
                const response = await fetch(`/api/admin/members/${memberId}`);
                const data = await response.json();
                const member = data.member;
                
                currentMemberId = memberId;
                document.getElementById('edit-name').value = member.name;
                document.getElementById('edit-email').value = member.email;
                document.getElementById('edit-phone').value = member.phone || '';
                document.getElementById('edit-role').value = member.role;
                document.getElementById('edit-status').value = member.status;
                document.getElementById('edit-modal').classList.add('show');
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        async function saveEditMember(e) {
            e.preventDefault();
            try {
                const response = await fetch(`/api/admin/members/${currentMemberId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('edit-name').value,
                        email: document.getElementById('edit-email').value,
                        phone: document.getElementById('edit-phone').value,
                        role: document.getElementById('edit-role').value,
                        status: document.getElementById('edit-status').value
                    })
                });
                if (!response.ok) throw new Error('Failed to update');
                showAlert('Member updated!', 'success');
                closeEditModal();
                loadMembers();
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
        }
        
        async function deleteMember(memberId) {
            if (!confirm('Delete this member?')) return;
            try {
                await fetch(`/api/admin/members/${memberId}`, { method: 'DELETE' });
                showAlert('Member deleted!', 'success');
                loadMembers();
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        function viewProfile(memberId) {
            window.location.href = `/profile.html?id=${memberId}`;
        }
        
        async function exportAllMembers() {
            try {
                const response = await fetch('/api/admin/members');
                const members = await response.json();
                let csv = 'Name,Email,Phone,Role,Status,Visits\n';
                members.forEach(m => {
                    csv += `"${m.name}","${m.email || ''}","${m.phone || ''}","${m.role}","${m.status}",${m.total_visits || 0}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `members_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }
        
        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
