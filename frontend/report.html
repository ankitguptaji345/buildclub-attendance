<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Reports</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 28px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #764ba2;
        }
        
        .btn-success {
            background: #27ae60;
        }
        
        .btn-success:hover {
            background: #229954;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
        }
        
        .card-content {
            padding: 20px;
        }
        
        .chart-container {
            position: relative;
            height: 350px;
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            padding: 40px 20px;
        }
        
        .stat-label {
            text-align: center;
            color: #999;
            margin-top: 10px;
        }
        
        .table-wrapper {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        select, input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Analytics & Reports</h1>
            <div class="controls">
                <button class="btn btn-success" onclick="exportAllReports()">📥 Export All</button>
                <button class="btn" onclick="goToDashboard()">← Dashboard</button>
            </div>
        </div>
        
        <div class="filters">
            <select id="date-filter">
                <option value="14">Last 14 Days</option>
                <option value="7">Last 7 Days</option>
                <option value="30">Last 30 Days</option>
                <option value="90">Last 90 Days</option>
            </select>
            <button class="btn" onclick="loadAnalytics()">🔄 Refresh</button>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="card-header">📈 Total Visits (14D)</div>
                <div class="card-content">
                    <div class="stat-value" id="stat-visits">0</div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">⏱️ Avg Duration</div>
                <div class="card-content">
                    <div class="stat-value" id="stat-avgduration">0</div>
                    <div class="stat-label">minutes</div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">👥 Active Members</div>
                <div class="card-content">
                    <div class="stat-value" id="stat-active">0</div>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="card-header">📅 Visits by Day</div>
                <div class="card-content">
                    <div class="chart-container">
                        <canvas id="daily-chart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">🕐 Check-In Times</div>
                <div class="card-content">
                    <div class="chart-container">
                        <canvas id="checkin-chart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">🚪 Check-Out Times</div>
                <div class="card-content">
                    <div class="chart-container">
                        <canvas id="checkout-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="table-wrapper" style="margin-bottom: 20px;">
            <div style="padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-size: 18px; font-weight: 600;">
                ⏰ Top 10 Members by Hours
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Total Hours</th>
                        <th>Total Visits</th>
                        <th>Avg Duration</th>
                        <th>Last Visit</th>
                    </tr>
                </thead>
                <tbody id="hours-table">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #999;">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let dailyChart, checkinChart, checkoutChart;
        
        document.addEventListener('DOMContentLoaded', loadAnalytics);
        
        async function loadAnalytics() {
            try {
                const days = document.getElementById('date-filter').value;
                
                // Load daily visits
                const dailyRes = await fetch(`/api/admin/analytics/daily?days=${days}`);
                const dailyData = await dailyRes.json();
                
                // Load hourly data
                const hourlyRes = await fetch('/api/admin/analytics/hourly');
                const hourlyData = await hourlyRes.json();
                
                // Load hours per member
                const hoursRes = await fetch('/api/admin/analytics/hours-per-member');
                const hoursData = await hoursRes.json();
                
                renderDailyChart(dailyData);
                renderHourlyCharts(hourlyData);
                renderHoursTable(hoursData);
                updateStats(dailyData, hoursData);
            } catch (err) {
                console.error('Error loading analytics:', err);
            }
        }
        
        function updateStats(dailyData, hoursData) {
            const totalVisits = dailyData.reduce((sum, d) => sum + d.visits, 0);
            const activeMembers = hoursData.filter(h => h.total_hours > 0).length;
            const avgDuration = hoursData.length > 0 
                ? (hoursData.reduce((sum, h) => sum + (h.avg_duration_min || 0), 0) / hoursData.length).toFixed(0)
                : 0;
            
            document.getElementById('stat-visits').textContent = totalVisits;
            document.getElementById('stat-avgduration').textContent = avgDuration;
            document.getElementById('stat-active').textContent = activeMembers;
        }
        
        function renderDailyChart(data) {
            const dates = data.map(d => d.date).reverse();
            const visits = dates.map(date => data.find(d => d.date === date).visits);
            
            if (dailyChart) dailyChart.destroy();
            
            const ctx = document.getElementById('daily-chart').getContext('2d');
            dailyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Visits',
                        data: visits,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        
        function renderHourlyCharts(data) {
            const hours = Array.from({length: 24}, (_, i) => i);
            const checkins = hours.map(h => data.arrivals.find(a => a.hour == h)?.count || 0);
            const checkouts = hours.map(h => data.departures.find(d => d.hour == h)?.count || 0);
            
            if (checkinChart) checkinChart.destroy();
            const ctx1 = document.getElementById('checkin-chart').getContext('2d');
            checkinChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: 'Check-Ins',
                        data: checkins,
                        backgroundColor: '#27ae60'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
            
            if (checkoutChart) checkoutChart.destroy();
            const ctx2 = document.getElementById('checkout-chart').getContext('2d');
            checkoutChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: 'Check-Outs',
                        data: checkouts,
                        backgroundColor: '#e74c3c'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        
        function renderHoursTable(data) {
            const tbody = document.getElementById('hours-table');
            tbody.innerHTML = data.map((member, idx) => `
                <tr>
                    <td>#${idx + 1}</td>
                    <td><strong>${member.name}</strong></td>
                    <td>${(member.total_hours || 0).toFixed(1)} hrs</td>
                    <td>${member.total_visits || 0}</td>
                    <td>${(member.avg_duration_min || 0).toFixed(0)} min</td>
                    <td>${member.last_visit ? new Date(member.last_visit).toLocaleDateString() : '-'}</td>
                </tr>
            `).join('');
        }
        
        async function exportAllReports() {
            try {
                const response = await fetch('/api/admin/analytics/hours-per-member');
                const members = await response.json();
                
                let csv = 'Name,Total Hours,Total Visits,Avg Duration (min),Last Visit\n';
                members.forEach(m => {
                    csv += `"${m.name}",${(m.total_hours || 0).toFixed(2)},${m.total_visits || 0},${(m.avg_duration_min || 0).toFixed(2)},"${m.last_visit ? new Date(m.last_visit).toLocaleDateString() : ''}"\n`;
                });
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `analytics_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            } catch (err) {
                alert('Error exporting: ' + err.message);
            }
        }
        
        function goToDashboard() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
