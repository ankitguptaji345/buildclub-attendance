<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
        }
        .profile-section {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }
        .profile-header {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 30px;
        }
        .profile-avatar {
            width: 150px;
            height: 150px;
            background: #f0f0f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .profile-info p {
            margin: 8px 0;
            color: #666;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #667eea;
            color: white;
        }
        .btn-danger { background: #e74c3c; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Profile</h1>
            <button class="btn" onclick="goBack()">← Back</button>
        </div>
        
        <div id="content" class="loading">Loading...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let currentMemberId = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            currentMemberId = params.get('id');
            if (currentMemberId) loadProfile();
        });
        
        async function loadProfile() {
            try {
                const response = await fetch(`/api/admin/members/${currentMemberId}`);
                const data = await response.json();
                renderProfile(data);
            } catch (err) {
                document.getElementById('content').innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
            }
        }
        
        function renderProfile(data) {
            const { member, attendance, stats } = data;
            const content = document.getElementById('content');
            
            content.innerHTML = `
                <div class="profile-section">
                    <div class="profile-header">
                        <div class="profile-avatar">${member.name.charAt(0)}</div>
                        <div class="profile-info">
                            <h2>${member.name}</h2>
                            <p><strong>Email:</strong> ${member.email}</p>
                            <p><strong>Phone:</strong> ${member.phone || 'N/A'}</p>
                            <p><strong>Role:</strong> ${member.role}</p>
                            <p><strong>Status:</strong> ${member.status}</p>
                            
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <div style="font-size:12px;color:#999;">Total Visits</div>
                                    <div class="stat-value">${stats.total_visits || 0}</div>
                                </div>
                                <div class="stat-card">
                                    <div style="font-size:12px;color:#999;">Total Hours</div>
                                    <div class="stat-value">${(stats.total_hours || 0).toFixed(1)}</div>
                                </div>
                                <div class="stat-card">
                                    <div style="font-size:12px;color:#999;">Avg Visit</div>
                                    <div class="stat-value">${(stats.avg_duration_min || 0).toFixed(0)}m</div>
                                </div>
                            </div>
                            
                            <div class="actions">
                                <button class="btn" onclick="exportCSV(${member.id})">📥 CSV</button>
                                <button class="btn" onclick="forceCheckout()">🚪 Force Checkout</button>
                                <button class="btn btn-danger" onclick="deleteMember()">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="profile-section">
                    <h3 style="margin-bottom:15px;">📊 Attendance</h3>
                    <div class="chart-container"><canvas id="chart"></canvas></div>
                </div>
                
                <div class="profile-section">
                    <h3 style="margin-bottom:15px;">📋 Recent Sessions</h3>
                    <table>
                        <thead><tr><th>Check-In</th><th>Check-Out</th><th>Duration</th></tr></thead>
                        <tbody>
                            ${attendance.slice(0, 10).map(a => `
                                <tr>
                                    <td>${new Date(a.check_in).toLocaleString()}</td>
                                    <td>${a.check_out ? new Date(a.check_out).toLocaleString() : 'Ongoing'}</td>
                                    <td>${a.duration_minutes || 'N/A'} min</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            // Render chart
            const dateMap = {};
            attendance.forEach(a => {
                const date = new Date(a.check_in).toLocaleDateString();
                dateMap[date] = (dateMap[date] || 0) + 1;
            });
            
            const dates = Object.keys(dateMap).reverse();
            const counts = dates.map(d => dateMap[d]);
            
            const ctx = document.getElementById('chart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Visits',
                        data: counts,
                        backgroundColor: '#667eea',
                        borderColor: '#764ba2',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        
        async function forceCheckout() {
            if (!confirm('Force checkout?')) return;
            try {
                await fetch(`/api/admin/members/${currentMemberId}/force-checkout`, { method: 'POST' });
                alert('Checked out!');
                loadProfile();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        
        async function exportCSV(memberId) {
            window.location.href = `/api/admin/members/${memberId}/export/csv`;
        }
        
        async function deleteMember() {
            if (!confirm('Delete member?')) return;
            try {
                await fetch(`/api/admin/members/${currentMemberId}`, { method: 'DELETE' });
                alert('Deleted!');
                goBack();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        
        function goBack() {
            window.location.href = '/members.html';
        }
    </script>
</body>
</html>
